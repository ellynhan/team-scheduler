name: CI

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
